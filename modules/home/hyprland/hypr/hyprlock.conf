# --- BACKGROUND ---
background {
    monitor =
    path = screenshot            # Takes a screenshot of current screen, or specify /path/to/wallpaper.png
    blur_passes = 3              # Blur intensity (0 to disable)
    blur_size = 6
    noise = 0.015
    contrast = 0.9
    brightness = 0.8
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# --- TIME DISPLAY ---
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(242, 243, 244, 0.9)
    font_size = 90
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 150
    halign = center
    valign = center
}

# --- DATE DISPLAY ---
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = rgba(166, 173, 200, 0.8)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

# --- USER GREETING ---
label {
    monitor =
    text = Hi there, $USER
    color = rgba(205, 214, 244, 0.75)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -20
    halign = center
    valign = center
}

# --- PASSWORD INPUT FIELD ---
input-field {
    monitor =
    size = 260, 50
    outline_thickness = 2
    dots_size = 0.25             # Scale of input dots (0.2 - 0.8)
    dots_spacing = 0.2           # Space between dots (0.0 - 1.0)
    dots_center = true
    dots_rounding = -1           # -1 circles, 0 square

    outer_color = rgba(180, 190, 254, 0.8)
    inner_color = rgba(30, 30, 46, 0.6)
    font_color = rgb(205, 214, 244)
    fade_on_empty = false
    placeholder_text = <span foreground="##a6adc8">Enter Password...</span>
    hide_input = false
    rounding = 20

    check_color = rgb(249, 226, 175)
    fail_color = rgb(243, 139, 168)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300        # Transition time in ms between normal/fail state

    position = 0, -80
    halign = center
    valign = center
}
