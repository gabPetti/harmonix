# Where `harmonix organize` puts things. This file is live: edit and rerun.
#
# A file is checked against [[rule]] globs first (top to bottom, first match
# wins, case-insensitive), then against [types] by extension. Anything that
# matches nothing stays where it is -- Downloads is the inbox for those.

# Folders whose direct children get sorted. Only loose files and git repos are
# ever moved; other folders are left alone.
sources = ["~/Downloads", "~/Desktop", "~", "~/repos", "~/Projects"]

# Files changed more recently than this may still be downloading.
min_age_minutes = 2

[code]
# Git repos go to <root>/<group>. A repo on your own GitHub account is always
# "personal", one with no remote too; a remote URL matching a group's regexes
# goes to that group; anything else is someone else's code, in "forks".
root = "~/Code"
uni = ["tecnico", "ulisboa"]

[[rule]]
match = ["screenshot*", "captura de ecrã*"]
to = "~/Pictures/Screenshots"

[[rule]]
match = ["*.code-workspace"]
to = "~/Code"

[types]
"~/Pictures" = ["png", "jpg", "jpeg", "gif", "webp", "svg", "heic", "avif", "bmp"]
"~/Videos" = ["mp4", "mkv", "webm", "mov", "avi"]
"~/Music" = ["mp3", "flac", "ogg", "opus", "wav", "m4a"]
"~/VMs" = ["iso", "ova", "ovf", "vmdk", "qcow2"]
# Documents land in an inbox rather than the root: which course or which part
# of life a PDF belongs to is a judgement call, made by hand or by a rule above.
"~/Documents/Inbox" = [
  "pdf", "epub", "doc", "docx", "odt", "rtf", "txt",
  "ppt", "pptx", "odp", "xls", "xlsx", "ods", "csv",
]
