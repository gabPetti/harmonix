# Matugen generated template for Zathura
# File: templates/zathura-colors.conf
#
# Colours only -- the static options live in zathura/config/zathurarc, which
# includes the rendered file. Every colour is opaque: window translucency is
# the compositor's job (Hyprland applies the same 0.85 to every window), so
# baking alpha in here would make Zathura more transparent than Kitty.

# Window chrome. `surface` is what Kitty paints as its background.
set default-bg                  "{{colors.surface.default.hex}}"
set default-fg                  "{{colors.on_surface.default.hex}}"

set statusbar-bg                "{{colors.surface_container_low.default.hex}}"
set statusbar-fg                "{{colors.on_surface_variant.default.hex}}"

set inputbar-bg                 "{{colors.surface_container_low.default.hex}}"
set inputbar-fg                 "{{colors.on_surface.default.hex}}"

set notification-bg             "{{colors.surface_container_low.default.hex}}"
set notification-fg             "{{colors.on_surface.default.hex}}"
set notification-error-bg       "{{colors.error_container.default.hex}}"
set notification-error-fg       "{{colors.on_error_container.default.hex}}"
set notification-warning-bg     "{{colors.tertiary_container.default.hex}}"
set notification-warning-fg     "{{colors.on_tertiary_container.default.hex}}"

set completion-bg               "{{colors.surface_container.default.hex}}"
set completion-fg               "{{colors.on_surface_variant.default.hex}}"
set completion-group-bg         "{{colors.surface_container_high.default.hex}}"
set completion-group-fg         "{{colors.primary.default.hex}}"
set completion-highlight-bg     "{{colors.secondary_container.default.hex}}"
set completion-highlight-fg     "{{colors.on_secondary_container.default.hex}}"

set index-bg                    "{{colors.surface.default.hex}}"
set index-fg                    "{{colors.on_surface.default.hex}}"
set index-active-bg             "{{colors.secondary_container.default.hex}}"
set index-active-fg             "{{colors.on_secondary_container.default.hex}}"

set highlight-color             "{{colors.tertiary_container.default.hex}}"
set highlight-active-color      "{{colors.primary.default.hex}}"

# The page itself, once `recolor` remaps it. lightcolor is the paper, so it
# takes the same `surface` as the window behind it -- a PDF then sits on one
# continuous background instead of a bright sheet floating on a dark frame.
set recolor-lightcolor          "{{colors.surface.default.hex}}"
set recolor-darkcolor           "{{colors.on_surface.default.hex}}"

set render-loading-bg           "{{colors.surface.default.hex}}"
set render-loading-fg           "{{colors.on_surface.default.hex}}"
